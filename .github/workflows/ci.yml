name: CI
on:
  push:
    branches: [main, 'feature/**', 'copilot/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Build
        run: go build -v ./cmd/muah-runner/
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          skip-cache: true
